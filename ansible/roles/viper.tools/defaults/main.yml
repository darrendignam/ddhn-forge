---
# viper.tools default values

# Set values for binary links, library files (e.g. jars) and source code
viper_root: "/usr/local"
viper_bin: "{{ viper_root }}/bin"
viper_lib: "{{ viper_root }}/lib"
viper_usr_share: "/usr/share"
viper_apps_share: "{{ viper_usr_share }}/applications"
viper_icons_share: "{{ viper_usr_share }}/icons"

# Account name
viper_account_name: "{{ viper_env_user_name | default('viper') }}"

# Tools installed via Debian package manager
viper_debian_tools:
  # Debian handbrake installation
  - "handbrake"
  # Debian Inkscape installation
  - "inkscape"
  # Debian GIMP installation
  - "gimp"

# OpenFixity's own desktop file id, which follows neither the package name nor the
# reverse-DNS convention the other tools use.
openfixity_desktop_id: "openfixity-OpenFixity"

# Desktop icon files
viper_debian_icons:
  # Atril, not Evince: MATE's document viewer. Verified against the desktop files the
  # build actually produces, since the ids do not follow package names consistently.
  - "atril"
  - "gimp"
  - "org.inkscape.Inkscape"
  - "mediainfo-gui"
  - "mediaconch-gui"
  - "fr.handbrake.ghb"

# JHOVE version details, to override set jhove_major_minor and jhove_patch
jhove_major: "1"
jhove_minor: "34"
jhove_patch: "0"
jhove_version: "{{ jhove_major }}.{{ jhove_minor }}.{{ jhove_patch }}"

# veraPDF version details, to override set verapdf_major }}.{{ verapdf_minor and vera_patch
verapdf_major: "1"
verapdf_minor: "30"
verapdf_patch: "2"
verapdf_version: "{{ verapdf_major }}.{{ verapdf_minor }}.{{ verapdf_patch }}"

droid_major: "6"
droid_minor: "9"
droid_patch: "13"
droid_version: "{{ droid_major }}.{{ droid_minor }}.{{ droid_patch }}"

# Apache Tika version details
# Held at the 2.x line deliberately. Tika 3.x is a major version and this image
# already carries four pre-release tools; adding an untested major bump on top
# makes a failure hard to attribute. Revisit once the rest has settled.
tika_major: "2"
tika_minor: "9"
tika_patch: "2"
tika_version: "{{ tika_major }}.{{ tika_minor }}.{{ tika_patch }}"

# FIDO version details
fido_version: "1.6.1"

# jpylyzer version details
jpylyzer_version: "2.2.1"

# Pre-release, and deliberately so: 0.20-beta-1 carries substantial improvements over
# the 0.18.x line and was on its way to becoming a release candidate.
odf_validator_version: "0.20-beta-1"

# Distributed only as an alpha, from GitHub releases rather than a package repository.
openfixity_version: "0.1.1-ALPHA"

# rclone comes from upstream rather than apt. Ubuntu 24.04 ships 1.60.1, from 2022,
# and the cloud providers rclone talks to change their OAuth flows regularly, so a
# client that old is the wrong thing to hand someone who needs to reach OneDrive or
# Google Drive. Upstream publishes a .deb per release.
rclone_version: "1.75.0"

# The Arlington PDF model build is published under /dev/ and versioned by build number,
# so this pins a build rather than a release tag.
verapdf_arlington_line: "1.31"
verapdf_arlington_version: "1.31.174"

viper:
  tools:
    jhove:
      name: "jhove"
      desktop_name: "JHOVE GUI"
      generic_name: "Format Validation"
      comment: "Open source file format identification, validation & characterisation from The Open Preservation Foundation."
      exec: "jhove-gui"
      icon: "jhove.png"
      version: "{{ jhove_version }}"
      source:
        git: "https://github.com/openpreserve/jhove.git"
        tag: "v{{ jhove_version }}"
      installer:
        # JHOVE dropped the "xplt" qualifier at 1.34: releases up to 1.32 are named
        # jhove-xplt-installer-X.Y.Z.jar, 1.34 onwards are jhove-installer-X.Y.Z.jar.
        loc: "https://software.openpreservation.org/releases/jhove/{{ jhove_major }}.{{ jhove_minor }}/jhove-installer-{{ jhove_version }}.jar"
      dests:
        bin: "{{ viper_bin }}"
        lib: "{{ viper_lib }}/jhove/{{ jhove_version }}"
    droid:
      name: "droid"
      desktop_name: "DROID GUI"
      generic_name: "Format Identification"
      comment: "File format identification tool from The National Archives of the UK."
      exec: "droid-gui"
      icon: "droid.png"
      version: "droid-{{ droid_version }}"
      source:
        git: "https://github.com/digital-preservation/droid.git"
        tag: "droid-{{ droid_version }}"
      installer:
        loc: "https://repo1.maven.org/maven2/uk/gov/nationalarchives/droid-binary/{{ droid_version }}/droid-binary-{{ droid_version }}-bin.zip"
      dests:
        bin: "{{ viper_bin }}"
        lib: "{{ viper_lib }}/droid/{{ droid_version }}"
    tika:
      name: "tika"
      desktop_name: "Apache Tika GUI"
      generic_name: "Format Characterisation"
      comment: "A content analysis toolkit from the Apache Foundation."
      exec: "tika-gui"
      icon: "tika.jpg"
      version: "{{ tika_version }}"
      source:
        git: "https://github.com/apache/tika.git"
        tag: "{{ tika_version }}"
      installer:
        loc: "https://archive.apache.org/dist/tika/{{ tika_version }}/tika-app-{{ tika_version }}.jar"
      dests:
        bin: "{{ viper_bin }}"
        lib: "{{ viper_lib }}/tika/{{ tika_version }}"
    verapdf:
      name: "verapdf"
      desktop_name: "verapdf GUI"
      generic_name: "Format Validation"
      comment: "Open source, industry supported PDF/A validation from the veraPDF consortium."
      exec: "verapdf-gui"
      icon: "verapdf.png"
      version: "{{ verapdf_version }}"
      source:
        git: "https://github.com/veraPDF/veraPDF-library.git"
        tag: "v{{ verapdf_version }}"
      installer:
        loc: "https://software.verapdf.org/rel/{{ verapdf_major }}.{{ verapdf_minor }}/verapdf-greenfield-{{ verapdf_version }}-installer.zip"
        root: "/tmp/vera-installer"
        script: "/tmp/vera-installer/verapdf-greenfield-{{ verapdf_version }}/verapdf-install"
      dests:
        bin: "{{ viper_bin }}"
        lib: "{{ viper_lib }}/veraPDF/{{ verapdf_version }}"
    fido:
      name: "fido"
      version: "{{ fido_version }}"
      package: "opf-fido"
      source:
        git: "https://github.com/openpreserve/fido.git"
        tag: "v{{ fido_version }}"
    jpylyzer:
      name: "jpylyzer"
      version: "{{ jpylyzer_version }}"
      package: "jpylyzer"
      source:
        git: "https://github.com/openpreserve/jpylyzer.git"
        tag: "{{ jpylyzer_version }}"
    odf-validator:
      name: "odf-validator"
      version: "{{ odf_validator_version }}"
      source:
        git: "https://github.com/openpreserve/odf-validator.git"
        tag: "v{{ odf_validator_version }}"
        loc: "https://github.com/openpreserve/odf-validator/releases/download/v{{ odf_validator_version }}/odf-validator-{{ odf_validator_version }}-all.jar"
    openfixity:
      name: "openfixity"
      version: "{{ openfixity_version }}"
      source:
        git: "https://github.com/openpreserve/OpenFixity.git"
        tag: "v{{ openfixity_version }}"
        loc: "https://github.com/openpreserve/OpenFixity/releases/download/v{{ openfixity_version }}/OpenFixity-{{ openfixity_version }}-linux-x64.deb"
    rclone:
      name: "rclone"
      version: "{{ rclone_version }}"
      source:
        git: "https://github.com/rclone/rclone.git"
        tag: "v{{ rclone_version }}"
        loc: "https://downloads.rclone.org/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-amd64.deb"
    verapdf-arlington:
      name: "verapdf-arlington"
      desktop_name: "Arlington PDF Model Checker"
      generic_name: "PDF Validation"
      comment: "Checks PDF files against the Arlington PDF Model. A veraPDF development build."
      exec: "arlington-pdf-model-checker-gui"
      # The Arlington cube, extracted from org/verapdf/gui/images/arlington-logo.png
      # in the tool's own gui jar, so the launcher matches the running application.
      # Not icon.png from the same jar, which is a cropped veraPDF wordmark.
      icon: "verapdf-arlington.png"
      version: "{{ verapdf_arlington_version }}"
      source:
        git: "https://github.com/veraPDF/veraPDF-library.git"
        tag: "arlington-{{ verapdf_arlington_version }}"
      installer:
        loc: "https://software.verapdf.org/dev/arlington/{{ verapdf_arlington_line }}/verapdf-arlington-{{ verapdf_arlington_version }}-installer.zip"
        root: "/tmp/vera-arlington-installer"
        script: "/tmp/vera-arlington-installer/verapdf-arlington-{{ verapdf_arlington_version }}/verapdf-install"
      dests:
        bin: "{{ viper_bin }}"
        lib: "{{ viper_lib }}/veraPDF-arlington/{{ verapdf_arlington_version }}"
    mediaarea:
      - name: "libzen0"
        download_url: "https://mediaarea.net/download/binary/libzen0/0.4.41/libzen0v5_0.4.41-1_amd64.Debian_12.deb"
        package_name: "libzen0v5_0.4.41-1_amd64.Debian_12.deb"
      - name: "libmediainfo0"
        download_url: "https://mediaarea.net/download/binary/libmediainfo0/26.05/libmediainfo0v5_26.05-1_amd64.Debian_12.deb"
        package_name: "libmediainfo0v5_26.05-1_amd64.Debian_12.deb"
      - name: "libmediaconch0"
        download_url: "https://mediaarea.net/download/binary/libmediaconch0/25.04/libmediaconch0_25.04-1_amd64.Debian_12.deb"
        package_name: "libmediaconch0_25.04-1_amd64.Debian_12.deb"
      # CLI counterparts, pinned to the same upstream versions as the GUIs below.
      # Ubuntu ships mediainfo 24.01 and mediaconch 23.10, which would put two
      # different versions of the same tool on one appliance and make the CLI and the
      # GUI disagree, so these come from MediaArea like everything else here.
      - name: "mediainfo"
        download_url: "https://mediaarea.net/download/binary/mediainfo/26.05/mediainfo_26.05-1_amd64.Debian_12.deb"
        package_name: "mediainfo_26.05-1_amd64.Debian_12.deb"
      - name: "mediaconch"
        download_url: "https://mediaarea.net/download/binary/mediaconch/25.04/mediaconch_25.04-1_amd64.Debian_12.deb"
        package_name: "mediaconch_25.04-1_amd64.Debian_12.deb"
      - name: "mediainfo-gui"
        download_url: "https://mediaarea.net/download/binary/mediainfo-gui/26.05/mediainfo-gui_26.05-1_amd64.Debian_12.deb"
        package_name: "mediainfo-gui_26.05-1_amd64.Debian_12.deb"
      - name: "mediaconch-gui"
        download_url: "https://mediaarea.net/download/binary/mediaconch-gui/25.04/mediaconch-gui_25.04-1_amd64.Debian_12.deb"
        package_name: "mediaconch-gui_25.04-1_amd64.Debian_12.deb"

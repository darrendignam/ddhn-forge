---
# DROID installation for viper.tools

- name: "DROID | Running Tool Setup."
  include_tasks: tool.yml
  vars:
    item: "{{ viper.tools.droid }}"

- name: "DROID | Download and upack installer."
  unarchive:
    src: "{{ viper.tools.droid.installer.loc }}"
    dest: "{{ viper.tools.droid.dests.lib }}"
    remote_src: yes

# droid.sh dispatches on argument count: with arguments it runs the command line jar,
# without them the UI jar. Both entry points are therefore the same script, and without
# the second one "droid" is not a command at a terminal.
- name: "DROID | Create symlinks for shell file."
  file:
    src: "{{ viper.tools.droid.dests.lib }}/droid.sh"
    dest: "{{ viper.tools.droid.dests.bin }}/{{ item }}"
    state: link
  loop:
    - "droid-gui"
    - "droid"

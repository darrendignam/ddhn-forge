---
# Main task entry point for viper.tools
- name: "ViPER TOOLS | Install MediaArea tools."
  import_tasks: mediaarea/main.yml

- name: "ViPER TOOLS | Install Debian Tools."
  import_tasks: debTools.yml

- name: "ViPER TOOLS | Install JHOVE."
  import_tasks: jhove.yml

- name: "ViPER TOOLS | Install DROID."
  import_tasks: droid.yml

- name: "ViPER TOOLS | Install Tika."
  import_tasks: tika.yml

- name: "ViPER TOOLS | Install veraPDF."
  import_tasks: verapdf.yml

- name: "ViPER TOOLS | Install veraPDF Arlington."
  import_tasks: verapdf-arlington.yml

- name: "ViPER TOOLS | Install FIDO."
  import_tasks: fido.yml

- name: "ViPER TOOLS | Install jpylyzer."
  import_tasks: jpylyzer.yml

- name: "ViPER TOOLS | Install ODF Validator."
  import_tasks: odf-validator.yml

- name: "ViPER TOOLS | Install OpenFixity."
  import_tasks: openfixity.yml

- name: "ViPER TOOLS | Install rclone."
  import_tasks: rclone.yml

# Last, so it records everything the tasks above actually installed.
- name: "ViPER TOOLS | Record installed tool versions."
  import_tasks: manifest.yml

# After every launcher exists, so the staged copy is complete.
- name: "ViPER TOOLS | Stage desktop launchers for the container."
  import_tasks: desktop-staging.yml
  when: ansible_virtualization_type == "docker"

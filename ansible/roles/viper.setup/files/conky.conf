-- ViPER system panel.
--
-- This file is a template. toggle-conky.sh fills in every placeholder from the live
-- screen geometry, so the panel is a full height sidebar down the right edge whatever
-- resolution the session is at.
--
-- Conky cannot resize itself when the display changes, and KasmVNC changes resolution
-- every time the browser window is resized. Toggling the panel off and on re-reads the
-- geometry and snaps it back to full height, which is the intended way to recover after
-- a resize.
--
-- Two readings were removed rather than fixed, because in a container they are the
-- host's and not the appliance's, which makes them worse than no reading at all:
--   CPU temperature, from /sys/class/hwmon, is the host machine's sensor
--   total RAM is the host's, since a container without a memory limit sees all of it
--
-- Free space on the working volume replaces them. For a preservation appliance that is
-- the number that actually stops work, since normalising video and images is what fills
-- a disk.

conky.config = {
    alignment = '__ALIGNMENT__',
    gap_x = __GAP_X__,
    gap_y = __GAP_Y__,
    minimum_width = __WIDTH__,
    maximum_width = __WIDTH__,
    minimum_height = __HEIGHT__,

    background = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = '__WINDOW_TYPE__',
    own_window_title = 'ViPER System Monitor',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = __OPACITY__,
    own_window_hints = '__WINDOW_HINTS__',

    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',

    update_interval = 2.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,

    default_color = 'FFFFFF',
    color1 = 'FFFFFF',
}

conky.text = [[
${font DejaVu Sans:size=11:bold}ViPER SYSTEM${font}
${hr 2}
${font DejaVu Sans:size=9:bold}Processor${font}${alignr}${cpu}%
${cpubar 6,__WIDTH__}
__CPUGRAPH__
${voffset 4}${font DejaVu Sans:size=9:bold}Memory${font}${alignr}${memperc}%
${membar 6,__WIDTH__}
${voffset 2}${mem} in use
${voffset 6}${font DejaVu Sans:size=9:bold}Working disk${font}${alignr}${fs_used_perc __WORKDIR__}%
${fs_bar 6,__WIDTH__ __WORKDIR__}
${voffset 2}${fs_free __WORKDIR__} free of ${fs_size __WORKDIR__}
${voffset 6}${font DejaVu Sans:size=9:bold}Network${font}${alignr}__NET_IF__
${voffset 2}Down ${downspeed __NET_IF__}${alignr}Up ${upspeed __NET_IF__}
__NETGRAPH__
${voffset 6}${hr 1}
${time %a %d %b %Y}${alignr}${time %H:%M}
]]

---
# Desktop environment setup for ViPER.
#
# VMs run MATE on Ubuntu 24.04 with Linux Mint's theming. Containers run XFCE, which
# webtop supplies pre-configured, so the two halves are guarded on virtualization_type.
#
# MATE is not GNOME with different names. Three differences matter here:
#   - the wallpaper key takes a plain path, not a file:// URI
#   - Caja draws the desktop itself once show-desktop-icons is set, so the Nemo autostart
#     shim the GNOME build needed is gone
#   - schema ids and dconf paths diverge, for example org.mate.background lives at
#     /org/mate/desktop/background/

- name: "Desktop | Create shared backgrounds directory."
  file:
    path: "/usr/local/share/backgrounds"
    state: directory
    mode: '0755'
  when: ansible_virtualization_type != "docker"

- name: "Desktop | Copy ViPER wallpaper to shared backgrounds directory."
  copy:
    src: "files/usr/local/share/backgrounds/viper-desktop.jpg"
    dest: "/usr/local/share/backgrounds/viper-desktop.jpg"
    mode: '0644'
  when: ansible_virtualization_type != "docker"

- name: "Desktop | Apply MATE desktop settings for the ViPER account."
  become: true
  become_user: "{{ viper.setup.limited_account.name }}"
  community.general.dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    # Wallpaper. Note this is a path, where GNOME took a file:// URI.
    - { key: "/org/mate/desktop/background/picture-filename",
        value: "'/usr/local/share/backgrounds/viper-desktop.jpg'" }
    - { key: "/org/mate/desktop/background/picture-options", value: "'zoom'" }
    # Caja draws the desktop, which is what puts the tool launchers on it
    - { key: "/org/mate/desktop/background/show-desktop-icons", value: "true" }
    - { key: "/org/mate/caja/desktop/volumes-visible", value: "true" }
    - { key: "/org/mate/caja/desktop/computer-icon-visible", value: "false" }
    - { key: "/org/mate/caja/desktop/home-icon-visible", value: "true" }
    - { key: "/org/mate/caja/desktop/trash-icon-visible", value: "true" }
    # The Mint look
    - { key: "/org/mate/desktop/interface/gtk-theme", value: "'Mint-Y-Blue'" }
    - { key: "/org/mate/desktop/interface/icon-theme", value: "'Mint-Y'" }
    - { key: "/org/mate/marco/general/theme", value: "'Mint-Y'" }
    # Launching a .desktop file from the desktop should just run it
    - { key: "/org/mate/caja/preferences/executable-text-activation", value: "'launch'" }
  loop_control:
    label: "{{ item.key }}"
  when: ansible_virtualization_type != "docker"

# Caja refuses to run a desktop launcher it does not trust, showing "Untrusted application
# launcher" instead of the tool. The trust flag is per-file user metadata, so it has to be
# set as the ViPER account, after the .desktop files exist.
- name: "Desktop | Find the tool launchers on the desktop."
  find:
    paths: "/home/{{ viper.setup.limited_account.name }}/Desktop"
    patterns: "*.desktop"
  register: viper_desktop_launchers
  when: ansible_virtualization_type != "docker"

- name: "Desktop | Mark the tool launchers as trusted for Caja."
  become: true
  become_user: "{{ viper.setup.limited_account.name }}"
  command: "gio set {{ item.path }} metadata::caja-trusted-launcher true"
  loop: "{{ viper_desktop_launchers.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  when: ansible_virtualization_type != "docker"

# Docker/XFCE Desktop Configuration
- name: "DOCKER | Create shared backgrounds directory."
  file:
    path: "/usr/local/share/backgrounds"
    state: directory
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy ViPER wallpaper to shared backgrounds directory."
  copy:
    src: "files/usr/local/share/backgrounds/viper-desktop.jpg"
    dest: "/usr/local/share/backgrounds/viper-desktop.jpg"
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Create Conky config directory."
  file:
    path: "/usr/local/share/conky"
    state: directory
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy Conky system monitor config to system location."
  copy:
    src: "files/conky.conf"
    dest: "/usr/local/share/conky/conky.conf"
    mode: '0644'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy Conky toggle script to system bin."
  copy:
    src: "files/toggle-conky.sh"
    dest: "/usr/local/bin/toggle-conky.sh"
    owner: "root"
    group: "root"
    mode: '0755'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy Conky toggle desktop file to applications menu."
  copy:
    src: "files/toggle-conky.desktop"
    dest: "/usr/share/applications/toggle-conky.desktop"
    owner: "root"
    group: "root"
    mode: '0644'
  when: ansible_virtualization_type == "docker"

# Note: /config is a volume mount, so we cannot create files there during build
# All /config configuration is handled by the post-install script at runtime

- name: "DOCKER | Install XFCE system monitor plugins."
  apt:
    name:
      - xfce4-systemload-plugin
      - xfce4-cpugraph-plugin
      - xfce4-netload-plugin
    state: present
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Configure Firefox as default browser in XFCE."
  file:
    src: "/usr/share/applications/firefox-esr.desktop"
    dest: "/usr/share/applications/chromium.desktop"
    state: link
    force: yes
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy post-install script for desktop icon configuration."
  copy:
    src: "{{ playbook_dir }}/../docker-files/post-install.sh"
    dest: "/usr/local/bin/viper-post-install.sh"
    owner: "root"
    group: "root"
    mode: '0755'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Create system-wide autostart desktop file for post-install script."
  copy:
    dest: "/etc/xdg/autostart/viper-post-install.desktop"
    owner: "root"
    group: "root"
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      Name=ViPER Desktop Setup
      Exec=/usr/local/bin/viper-post-install.sh
      Hidden=false
      NoDisplay=true
      X-GNOME-Autostart-enabled=true
      X-GNOME-Autostart-Delay=10
      StartupNotify=false
  when: ansible_virtualization_type == "docker"

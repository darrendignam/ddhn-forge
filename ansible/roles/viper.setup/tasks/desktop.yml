---
# Desktop environment setup for ViPER.
#
# Both VMs and containers run MATE on Ubuntu 26.04 with Linux Mint's theming, so the
# desktop settings themselves are shared. They are applied through a system-wide dconf
# database rather than per-user keys, for two reasons:
#   - in the container /config is a volume mount, so anything written into the account's
#     home at build time is discarded when the volume is attached at run time
#   - a system db is a default, not an override, so the user can still change any of it
#
# MATE is not GNOME with different names. Three differences matter here:
#   - the wallpaper key takes a plain path, not a file:// URI
#   - Caja draws the desktop itself once show-desktop-icons is set, so the Nemo autostart
#     shim the GNOME build needed is gone
#   - schema ids and dconf paths diverge, for example org.mate.background lives at
#     /org/mate/desktop/background/

- name: "Desktop | Create shared backgrounds directory."
  file:
    path: "/usr/local/share/backgrounds"
    state: directory
    mode: '0755'

- name: "Desktop | Copy ViPER wallpaper to shared backgrounds directory."
  copy:
    src: "files/usr/local/share/backgrounds/viper-desktop.jpg"
    dest: "/usr/local/share/backgrounds/viper-desktop.jpg"
    mode: '0644'

- name: "Desktop | Create the dconf profile and database directories."
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/viper.d

- name: "Desktop | Install the system-wide dconf profile."
  copy:
    src: "files/etc/dconf/profile/user"
    dest: "/etc/dconf/profile/user"
    owner: root
    group: root
    mode: '0644'

- name: "Desktop | Install the ViPER MATE desktop defaults."
  template:
    src: "etc/dconf/db/viper.d/00-viper-desktop.j2"
    dest: "/etc/dconf/db/viper.d/00-viper-desktop"
    owner: root
    group: root
    mode: '0644'
  notify: compile the dconf database

# Interactive shell. /etc/zsh/zshrc is sourced for every interactive zsh, so this
# reaches the desktop terminal and any SSH session without touching a user dotfile.
- name: "Shell | Install the ViPER zsh configuration."
  copy:
    src: "files/etc/zsh/viper.zsh"
    dest: "/etc/zsh/viper.zsh"
    owner: root
    group: root
    mode: '0644'

- name: "Shell | Source the ViPER zsh configuration from the system zshrc."
  lineinfile:
    path: /etc/zsh/zshrc
    line: "[[ -r /etc/zsh/viper.zsh ]] && source /etc/zsh/viper.zsh"
    state: present
    create: true
    owner: root
    group: root
    mode: '0644'

- name: "Shell | Ensure the ViPER share directory exists."
  file:
    path: "/usr/local/share/viper"
    state: directory
    owner: root
    group: root
    mode: '0755'

# zsh runs zsh-newuser-install whenever an account has none of .zshenv, .zprofile,
# .zshrc or .zlogin, which opens a blocking configuration menu the first time anyone
# opens a terminal. A system wide config in /etc/zsh does not count, so every account
# needs the file to exist even though it is deliberately almost empty.
- name: "Shell | Install a default .zshrc into /etc/skel."
  copy:
    src: "files/etc/skel/.zshrc"
    dest: "/etc/skel/.zshrc"
    owner: root
    group: root
    mode: '0644'

# The ViPER account already exists by this point, so skel does not reach it. The
# container equivalent runs from post-install.sh, because there the home is a volume.
- name: "Shell | Install .zshrc for the ViPER account."
  copy:
    src: "files/etc/skel/.zshrc"
    dest: "{{ viper.setup.limited_account.home }}/.zshrc"
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"
    mode: '0644'
  when: ansible_virtualization_type != "docker"

- name: "Shell | Stage .zshrc for the container account."
  copy:
    src: "files/etc/skel/.zshrc"
    dest: "/usr/local/share/viper/zshrc"
    owner: root
    group: root
    mode: '0644'
  when: ansible_virtualization_type == "docker"

# Seeds the grey autosuggestions. A new appliance has no shell history, so without
# this the feature stays invisible until the user has typed each command by hand.
- name: "Shell | Install the seeded ViPER command history."
  copy:
    src: "files/usr/local/share/viper/viper-history"
    dest: "/usr/local/share/viper/viper-history"
    owner: root
    group: root
    mode: '0644'

# The reference ships with the appliance, so it works with no network. It is the same
# file as docs/tools/cli.md, copied rather than duplicated so the two cannot drift.
- name: "Shell | Install the ViPER command line reference."
  copy:
    src: "{{ playbook_dir }}/../docs/tools/cli.md"
    dest: "/usr/local/share/viper/CLI-REFERENCE.md"
    owner: root
    group: root
    mode: '0644'

- name: "Shell | Install the viper-tools reference viewer."
  copy:
    src: "files/usr/local/bin/viper-tools"
    dest: "/usr/local/bin/viper-tools"
    owner: root
    group: root
    mode: '0755'

# The terminal takes the account's login shell from /etc/passwd. The VM logs in as the
# ViPER account, the container's desktop runs as abc, so both need setting.
- name: "Shell | Make zsh the login shell."
  user:
    name: "{{ (ansible_virtualization_type == 'docker') | ternary('abc', viper.setup.limited_account.name) }}"
    shell: /usr/bin/zsh

# Desktop folder shortcuts. The target is created here so the link is never dangling,
# and stays root owned: a shared corpus is reference material, not a working directory.
- name: "Desktop | Create the target directories for desktop folder shortcuts."
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ viper_desktop_folders }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Desktop | Populate the shared sample corpus."
  copy:
    src: "files/usr/local/share/viper/samples/"
    dest: "/usr/local/share/viper/samples/"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: "Desktop | Link the shared folders onto the ViPER desktop."
  file:
    src: "{{ item.path }}"
    dest: "{{ viper.setup.limited_account.home }}/Desktop/{{ item.name }}"
    state: link
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"
    force: true
  loop: "{{ viper_desktop_folders }}"
  loop_control:
    label: "{{ item.name }}"
  when: ansible_virtualization_type != "docker"

# The Caja trust marking for the tool launchers used to sit here. It cannot: viper.setup
# runs before viper.tools, so it scanned a Desktop directory that user.yml had created
# empty moments earlier and marked nothing, on every build. It now lives in
# viper.tools/tasks/desktop-trust.yml, after the launchers exist.

# The container desktop lives on the /config volume, which is replaced at run time, so
# its shortcuts are made by post-install.sh instead. It reads the list from here rather
# than hardcoding it, so both halves stay driven by viper_desktop_folders.
- name: "DOCKER | Ensure the ViPER share directory exists."
  file:
    path: "/usr/local/share/viper"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Record the desktop folder shortcuts for post-install."
  copy:
    dest: "/usr/local/share/viper/desktop-folders.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      # name<TAB>target, written from viper_desktop_folders. Read by post-install.sh.
      {% for folder in viper_desktop_folders %}
      {{ folder.name }}	{{ folder.path }}
      {% endfor %}
  when: ansible_virtualization_type == "docker"

# The ViPER system panel, on both targets. These were gated to the container, so the
# released VM shipped without conky, without the toggle script and without the menu
# entry, even though toggle-conky.sh branches on /config precisely so it works on both.
- name: "Desktop | Create the Conky configuration directory."
  file:
    path: "/usr/local/share/conky"
    state: directory

- name: "Desktop | Install the ViPER system panel template."
  copy:
    src: "files/conky.conf"
    dest: "/usr/local/share/conky/conky.conf"
    mode: '0644'

- name: "Desktop | Install the system panel toggle."
  copy:
    src: "files/toggle-conky.sh"
    dest: "/usr/local/bin/toggle-conky.sh"
    owner: "root"
    group: "root"
    mode: '0755'

- name: "Desktop | Add the system panel to the applications menu."
  copy:
    src: "files/toggle-conky.desktop"
    dest: "/usr/share/applications/toggle-conky.desktop"
    owner: "root"
    group: "root"
    mode: '0644'

# The container starts the panel from post-install.sh once the /config volume is
# populated. The VM has no such step, so it gets an ordinary autostart entry. The delay
# lets MATE finish drawing the panel, which toggle-conky.sh measures to size the sidebar.
- name: "Desktop | Start the system panel with the VM session."
  copy:
    dest: "/etc/xdg/autostart/viper-system-panel.desktop"
    owner: "root"
    group: "root"
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      Name=ViPER System Panel
      Exec=/usr/local/bin/toggle-conky.sh
      NoDisplay=true
      X-MATE-Autostart-Delay=8
      StartupNotify=false
  when: ansible_virtualization_type != "docker"

# Container-only configuration below. The container shares the desktop settings above and
# differs only in how the session is started and how /config is populated at run time.

# Note: /config is a volume mount, so we cannot create files there during build
# All /config configuration is handled by the post-install script at runtime

# The session launcher. /defaults/startwm.sh is what actually starts the desktop, and
# s6-rc.d/svc-de/run invokes it directly. The Selkies base keeps this same contract, so
# this task survived the move off KasmVNC unchanged apart from these notes. Writing MATE
# into /defaults/autostart instead does nothing: that file is openbox's, and it is not
# read once startwm.sh launches something other than openbox.
#
# Overwritten wholesale rather than patched: the stock script ends in openbox-session,
# which is not what ViPER runs. The Nvidia block is kept verbatim from the base so GPU
# passthrough behaves the same.
- name: "DOCKER | Start MATE as the container session."
  copy:
    dest: "/defaults/startwm.sh"
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/bash

      # Enable Nvidia GPU support if detected
      if which nvidia-smi; then
          export LIBGL_KOPPER_DRI2=1
          export MESA_LOADER_DRIVER_OVERRIDE=zink
          export GALLIUM_DRIVER=zink
      fi

      export XDG_CURRENT_DESKTOP=MATE
      export XDG_SESSION_DESKTOP=mate
      export DESKTOP_SESSION=mate

      # dbus-run-session, not dbus-launch --exit-with-session, which is what the stock
      # script still uses. --exit-with-session ties the bus to its own X connection, so
      # with no X it prints an address and then tears the daemon down, unlinking the
      # socket. On the KasmVNC base svc-de did not depend on the X server at all, so
      # this raced it and the session died behind a "Could not connect to session bus"
      # dialog about one boot in nine. Selkies adds svc-xorg to svc-de's dependencies,
      # which closes that particular window, but dbus-run-session is kept because it
      # ties the bus to the child process and so removes the failure mode rather than
      # narrowing it.
      dbus-run-session -- /usr/bin/mate-session > /dev/null 2>&1
  when: ansible_virtualization_type == "docker"

# HandBrake registers every video MIME type because it transcodes them, so with no media
# player installed it became the system default for opening video and audio, and MATE's
# Preferred Applications listed a transcoder as the Multimedia Player. Installing mpv is
# not enough on its own: the existing default is recorded and survives, so the association
# has to be stated.
#
# /etc/xdg/mimeapps.list is the system-wide default list, so this covers both the VM and
# the container and applies to every account rather than only the one the container runs.
- name: "DESKTOP | Make mpv the default for audio and video."
  copy:
    dest: /etc/xdg/mimeapps.list
    owner: root
    group: root
    mode: '0644'
    content: |
      [Default Applications]
      {% for t in viper_media_mime_types %}
      {{ t }}=mpv.desktop
      {% endfor %}

# ImageMagick's "display" is a debugging tool with an interface nobody wants to meet by
# accident, and it registers every image MIME type, so it shows up in menus and in MATE's
# Preferred Applications as a candidate image viewer. eom is already installed and is
# already the xdg-mime default for every image type, so this only stops display being
# offered; it does not change what a double click opens.
#
# Globbed rather than named: the file carries the ImageMagick major version and quantum
# depth, currently display-im7.q16.desktop, and both move between releases.
- name: "DESKTOP | Find ImageMagick's display launcher."
  find:
    paths: /usr/share/applications
    patterns: "display-im*.desktop"
  register: imagemagick_launchers

- name: "DESKTOP | Hide ImageMagick's display from menus and preferred applications."
  lineinfile:
    path: "{{ item.path }}"
    regexp: '^NoDisplay='
    line: "NoDisplay=true"
    insertafter: '^\[Desktop Entry\]$'
  loop: "{{ imagemagick_launchers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# Browser tab favicon and the client icon.
#
# /usr/share/selkies/www is an input directory, not the web root. nginx serves
# /usr/share/selkies/web, and init-nginx populates the branding from www at container
# start with:
#
#   cp www/icon.png web/favicon.ico
#   cp www/icon.png web/icon.png
#
# So one PNG becomes both the tab icon and the client icon, and www/favicon.ico is never
# read by anything. Writing one used to happen here and achieved nothing; it is dropped
# rather than pointed at web/, because anything written directly to web/ is overwritten
# by that copy on the next start.
- name: "DOCKER | Apply ViPER browser branding."
  copy:
    src: "{{ playbook_dir }}/../docker-files/apple-touch-icon.png"
    dest: "/usr/share/selkies/www/icon.png"
    owner: root
    group: root
    mode: '0644'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Copy post-install script for desktop icon configuration."
  copy:
    src: "{{ playbook_dir }}/../docker-files/post-install.sh"
    dest: "/usr/local/bin/viper-post-install.sh"
    owner: "root"
    group: "root"
    mode: '0755'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Create system-wide autostart desktop file for post-install script."
  copy:
    dest: "/etc/xdg/autostart/viper-post-install.desktop"
    owner: "root"
    group: "root"
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      Name=ViPER Desktop Setup
      Exec=/usr/local/bin/viper-post-install.sh
      Hidden=false
      NoDisplay=true
      # mate-session 1.26 reads X-MATE-Autostart-Delay and has no concept of the
      # GNOME keys, so the delay this file asked for was silently discarded and the
      # script ran the instant the session came up.
      X-MATE-Autostart-Delay=10
      StartupNotify=false
  when: ansible_virtualization_type == "docker"

---
# Main task entry point for viper.setup

- name: "USER | Ensure group vboxsf exists"
  ansible.builtin.group:
    name: "vboxsf"
    state: present

- name: "USER | Creating user account: {{ viper.setup.limited_account.name }}."
  user:
    name: "{{ viper.setup.limited_account.name }}"
    comment: "Sudo user account for server admin."
    createhome: yes
    home: "{{ viper.setup.limited_account.home }}"
    shell: "/bin/bash"
    # ViPER is a research environment, so users have to be able to install their own
    # tools. This is the only administrative path on the appliance: the build account
    # is locked during cleanup and root has no password.
    #
    # The account password is what stands between a visitor and root. Until v1.4.0 it
    # was empty, and Ubuntu's nullok in common-auth accepted that, so sudo granted root
    # to anyone who pressed Enter. smoke-test.sh now asserts an empty password is
    # rejected, since a silently reverted password looks exactly like the old bug.
    groups: "vboxsf,sudo"
    password: "{{ viper.setup.limited_account.password }}"
    update_password: always
    append: yes

# The build used to copy ~/.ssh/id_rsa.pub from whoever ran it into the shipped
# account's authorized_keys. That put the maintainer's personal public key into every
# released appliance: v1.2 shipped "cfw@dm-ultra". It also made the build depend on the
# operator having an RSA keypair, which was documented nowhere and failed the build
# outright when they did not.
#
# A published appliance has no business carrying anyone's key. Removed rather than made
# optional: anyone wanting SSH into a development build can add a key to the running
# machine.
#
# An earlier version of this comment said the key granted nothing because sshd was
# disabled. That was wrong. cleanup.sh disabled ssh.service while Ubuntu 24.04
# socket-activates sshd through ssh.socket, so the shipped v1.4.0 image was listening on
# 0.0.0.0:22 and accepting logins. Both units are disabled now.

# The webtop base image ships "%sudo ALL=(ALL:ALL) NOPASSWD: ALL" in /etc/sudoers, so
# abc gets root with no prompt at all and setting a password on the account changes
# nothing. Ubuntu's own default is a password prompt, which is what the VM gets, so this
# brings the container back in line rather than inventing a new policy.
- name: "DOCKER | Require a password for sudo, as Ubuntu does by default."
  lineinfile:
    path: /etc/sudoers
    regexp: '^%sudo\s'
    line: '%sudo	ALL=(ALL:ALL) ALL'
    validate: 'visudo -cf %s'
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Give the container desktop account the same password as the VM."
  user:
    name: "abc"
    password: "{{ viper.setup.limited_account.password }}"
    update_password: always
  when: ansible_virtualization_type == "docker"

- name: "USER | Create user desktop dir."
  file:
    path: "{{ viper.setup.limited_account.home }}/Desktop"
    state: directory
    mode: '0775'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

- name: "USER | Create .config directory for user."
  file:
    path: "{{ viper.setup.limited_account.home }}/.config"
    state: directory
    mode: '0755'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

# gnome-initial-setup-done was touched here to stop GNOME's first run wizard. MATE has
# no equivalent wizard and never reads that file, so the task was doing nothing on every
# VM build since the move to MATE.

- name: "USER | Create autostart directory for user."
  file:
    path: "{{ viper.setup.limited_account.home }}/.config/autostart"
    state: directory
    mode: '0755'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

# GNOME needed an autostart shim to stop it restoring the previous session and landing
# the user in the Activities overview. MATE has no overview and does not restore sessions
# by default, so the equivalent is two plain settings, and they live with the rest of the
# desktop defaults in files/etc/dconf/db/viper.d/00-viper-desktop.
- name: "USER | Add execute privileges to the desktop dir."
  file:
    path: "{{ viper.setup.limited_account.home }}/Desktop"
    state: directory
    mode: a+x

- name: "USER | Set up auto login via LightDM."
  template:
    src: "etc/lightdm/lightdm.conf.j2"
    dest: "/etc/lightdm/lightdm.conf"
    owner: root
    group: root
    mode: '0644'
  when: ansible_virtualization_type != "docker"

- name: "USER | Make MATE the default session for the account."
  copy:
    dest: "/var/lib/AccountsService/users/{{ viper.setup.limited_account.name }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      [User]
      Session=mate
      XSession=mate
      SystemAccount=false
  when: ansible_virtualization_type != "docker"
---
# Main task entry point for viper.setup

- name: "USER | Ensure group vboxsf exists"
  ansible.builtin.group:
    name: "vboxsf"
    state: present

- name: "USER | Creating user account: {{ viper.setup.limited_account.name }}."
  user:
    name: "{{ viper.setup.limited_account.name }}"
    comment: "Sudo user account for server admin."
    createhome: yes
    home: "{{ viper.setup.limited_account.home }}"
    shell: "/bin/bash"
    # ViPER is a research environment, so users have to be able to install their own
    # tools. This is the only administrative path on the appliance: the build account
    # is locked during cleanup and root has no password. sudo prompts, and the blank
    # password satisfies it via the nullok that Ubuntu's common-auth ships by
    # default. smoke-test.sh proves that works rather than trusting it.
    groups: "vboxsf,sudo"
    password: "{{ viper.setup.limited_account.password }}"
    update_password: always
    append: yes

# The build used to copy ~/.ssh/id_rsa.pub from whoever ran it into the shipped
# account's authorized_keys. That put the maintainer's personal public key into every
# released appliance: v1.2 shipped "cfw@dm-ultra". It also made the build depend on the
# operator having an RSA keypair, which was documented nowhere and failed the build
# outright when they did not.
#
# A published appliance has no business carrying anyone's key, and sshd is disabled in
# cleanup.sh regardless, so the key granted nothing. Removed rather than made optional:
# anyone wanting SSH into a development build can add a key to the running machine.

- name: "USER | Create user desktop dir."
  file:
    path: "{{ viper.setup.limited_account.home }}/Desktop"
    state: directory
    mode: '0775'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

- name: "USER | Create .config directory for user."
  file:
    path: "{{ viper.setup.limited_account.home }}/.config"
    state: directory
    mode: '0755'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

- name: "USER | Mark GNOME initial setup as completed."
  file:
    path: "{{ viper.setup.limited_account.home }}/.config/gnome-initial-setup-done"
    state: touch
    mode: '0644'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"
  when: ansible_virtualization_type != "docker"

- name: "USER | Create autostart directory for user."
  file:
    path: "{{ viper.setup.limited_account.home }}/.config/autostart"
    state: directory
    mode: '0755'
    owner: "{{ viper.setup.limited_account.name }}"
    group: "{{ viper.setup.limited_account.name }}"

# GNOME needed an autostart shim to stop it restoring the previous session and landing
# the user in the Activities overview. MATE has no overview and does not restore sessions
# by default, so the equivalent is two plain settings, and they live with the rest of the
# desktop defaults in files/etc/dconf/db/viper.d/00-viper-desktop.
- name: "USER | Add execute privileges to the desktop dir."
  file:
    path: "{{ viper.setup.limited_account.home }}/Desktop"
    state: directory
    mode: a+x

- name: "USER | Set up auto login via LightDM."
  template:
    src: "etc/lightdm/lightdm.conf.j2"
    dest: "/etc/lightdm/lightdm.conf"
    owner: root
    group: root
    mode: '0644'
  when: ansible_virtualization_type != "docker"

- name: "USER | Make MATE the default session for the account."
  copy:
    dest: "/var/lib/AccountsService/users/{{ viper.setup.limited_account.name }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      [User]
      Session=mate
      XSession=mate
      SystemAccount=false
  when: ansible_virtualization_type != "docker"
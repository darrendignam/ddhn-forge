---
# Server tasks for viper.setup

- name: "APT | Update apt repos and upgrade distro."
  apt:
    update_cache: "yes"
    upgrade: "dist"

- name: "HOST | Set the hostname: {{ viper.setup.hostname }}."
  hostname:
    name: "{{ viper.setup.hostname }}"

- name: "HOST | Set up /etc/hosts"
  template:
    src: "etc/hosts.j2"
    dest: "/etc/hosts"
    owner: "root"
  when: ansible_virtualization_type != "docker"

- name: "HOST | Set the timezone: {{ viper.setup.timezone }}."
  timezone:
    name: "{{ viper.setup.timezone }}"
  when: ansible_virtualization_type != "docker"

- name: "DOCKER | Set timezone via symlink"
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ viper.setup.timezone }}"
    dest: /etc/localtime
    state: link
    force: yes
  when: ansible_virtualization_type == "docker"

- name: "DOCKER | Set timezone in /etc/timezone"
  ansible.builtin.copy:
    content: "{{ viper.setup.timezone }}\n"
    dest: /etc/timezone
  when: ansible_virtualization_type == "docker"

# The removal used to run here as well as in prerequisites.yml. This copy ran before
# anything had been installed and without purge or autoremove, so it was a strictly
# weaker duplicate of the later one: two full apt transactions per build for the work
# of one. prerequisites.yml owns the removal now.

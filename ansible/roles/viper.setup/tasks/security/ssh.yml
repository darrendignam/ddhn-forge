---
# Main task entry point for viper.setup

# The SSH hardening used to live here as three `replace` tasks against sshd_config, and
# two of the three did nothing on Ubuntu 24.04:
#
#   PermitRootLogin        the regexp '^PermitRootLogin yes$' never matched noble's
#                          '#PermitRootLogin prohibit-password', so it was a silent no-op
#   PasswordAuthentication the edit landed, but sshd takes the FIRST value it finds for a
#                          keyword and the Include sits above it, so cloud-init's
#                          50-cloud-init.conf won with 'PasswordAuthentication yes'
#
# A booted v1.4.0 image was confirmed listening on 0.0.0.0:22 and accepting logins. The
# hardening is now a 00- drop-in, staged by cleanup.sh and activated by the Packer
# shutdown_command, because doing it here would cut off Packer's own password
# authenticated connection part way through the build.

- name: "SSH | Install first boot host key generation unit."
  copy:
    src: "files/etc/systemd/system/viper-regenerate-host-keys.service"
    dest: "/etc/systemd/system/viper-regenerate-host-keys.service"
    owner: "root"
    group: "root"
    mode: '0644'

- name: "SSH | Enable first boot host key generation."
  systemd:
    name: "viper-regenerate-host-keys.service"
    enabled: yes
    daemon_reload: yes

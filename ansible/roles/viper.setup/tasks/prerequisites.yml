---
# Prerequisites for viper.setup

# openjdk-17 setup requires this path exist before we continue inside a container.
- name: "APT | Ensure /usr/share/man/man1/ directory exists"
  file:
    path: /usr/share/man/man1/
    state: directory
    mode: '0755'

# The Mint desktop packages live in Mint's own repository, not Ubuntu's. Mint 22.x is
# Ubuntu with this repository added, which is exactly what ViPER needs: a base that
# can be installed unattended, wearing the Mint desktop. Both the VM and the container
# use it, so this is not guarded on virtualization_type.
- name: "MINT | Download the Linux Mint archive keyring."
  get_url:
    url: "{{ mint_keyring_url }}"
    dest: /tmp/linuxmint-keyring.deb
    checksum: "sha256:{{ mint_keyring_sha256 }}"
    mode: '0644'

- name: "MINT | Install the Linux Mint archive keyring."
  apt:
    deb: /tmp/linuxmint-keyring.deb

- name: "MINT | Read the fingerprint of the installed keyring."
  command: gpg --show-keys --with-colons /usr/share/keyrings/linuxmint-keyring.gpg
  register: mint_keyring_check
  changed_when: false

- name: "MINT | Fail unless the keyring carries Mint's published signing key."
  assert:
    that: "mint_keyring_fingerprint in mint_keyring_check.stdout"
    fail_msg: >-
      /usr/share/keyrings/linuxmint-keyring.gpg does not contain
      {{ mint_keyring_fingerprint }}. Refusing to trust the Mint repository.

- name: "MINT | Remove the downloaded keyring package."
  file:
    path: /tmp/linuxmint-keyring.deb
    state: absent

- name: "MINT | Add the Linux Mint repository."
  apt_repository:
    repo: "deb http://packages.linuxmint.com {{ mint_codename }} main upstream import backport"
    filename: "linuxmint"
    state: present
    update_cache: true

# Mint rebuilds packages that also exist in Ubuntu, MATE and Caja among them. Taking
# Mint's MATE does not work here: its metapackages depend on the rest of a Mint system,
# and pinning some of that in while leaving the rest out produces unsatisfiable
# dependencies. The intent is Ubuntu's base wearing Mint's theming, so Mint is pinned
# down globally and only the theming packages are raised. MATE, Caja and the greeter all
# come from Ubuntu.
- name: "MINT | Pin the Mint repository to theming packages only."
  copy:
    dest: /etc/apt/preferences.d/linuxmint
    mode: '0644'
    content: |
      Package: *
      Pin: origin packages.linuxmint.com
      Pin-Priority: 100

      Package: mint-themes mint-y-icons mint-artwork mint-backgrounds-* mintmenu
      Pin: origin packages.linuxmint.com
      Pin-Priority: 700

      Package: firefox
      Pin: origin packages.linuxmint.com
      Pin-Priority: 700

- name: "APT | Keep Ubuntu's Firefox snap stub out of the way."
  copy:
    dest: /etc/apt/preferences.d/firefox-no-snap
    mode: '0644'
    # Ubuntu's "firefox" is a transition stub that installs the snap and ships no
    # .desktop file, so mintMenu's Firefox favourite pointed at nothing. Snap does not
    # run in the container anyway. Mint package a real Firefox deb because they refuse
    # snap, and the repository is already trusted and pinned above.
    #
    # This has to keep the stub from ever being installed, not merely lose to Mint on
    # priority: Ubuntu's carries an epoch (1:1snap1-0ubuntu8), which outranks Mint's
    # 155.0.1 whatever the pin says, so once the stub is on the system apt treats the
    # real browser as a downgrade and refuses it.
    content: |
      Package: firefox*
      Pin: release o=Ubuntu*
      Pin-Priority: -1

- name: "APT | Install apt package pre-requisites."
  apt:
    name: "{{ viper.setup.prereqs.apt }}"
    state: "latest"

- name: "LOCALE | Set up common locale packages."
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  with_items: "{{ viper.setup.locales }}"
  notify:
    - rebuild locales database

- name: "LOCALE | Set default locale."
  debconf:
    name: locales
    question: locales/default_environment_locale
    value: "{{ viper.setup.default_locale }}"
    vtype: select
  notify:
    - rebuild locales database

- name: "LOCALE | Setup keyboard defaults."
  copy:
    src: "files/etc/default/keyboard"
    dest: "/etc/default/keyboard"

- name: "GRUB | Configure GRUB to skip boot menu."
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT='
    line: 'GRUB_TIMEOUT=0'
    backup: yes
  notify: update grub configuration
  when: ansible_virtualization_type != "docker"

- name: "GRUB | Hide GRUB menu for faster boot."
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT_STYLE='
    line: 'GRUB_TIMEOUT_STYLE=hidden'
    insertafter: '^GRUB_TIMEOUT='
  notify: update grub configuration
  when: ansible_virtualization_type != "docker"

- name: "APT | Remove unnecessary packages."
  apt:
    name: "{{ viper.setup.remove.apt }}"
    state: "absent"
    purge: yes
    autoremove: yes

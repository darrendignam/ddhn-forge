---
# viper.setup handlers

- name: restart iptables-persistent
  service:
    name: iptables-persistent
    state: restarted

- name: rebuild locales database
  command: "{{ item }}"
  with_items:
    - dpkg-reconfigure locales -f noninteractive
    - /usr/sbin/locale-gen

- name: update grub configuration
  ansible.builtin.shell: |
    if [ -x /usr/sbin/update-grub ]; then
      /usr/sbin/update-grub
    elif [ -x /usr/sbin/grub-mkconfig ]; then
      /usr/sbin/grub-mkconfig -o /boot/grub/grub.cfg
    else
      echo "ERROR: No grub update tool found" >&2
      exit 1
    fi


# dconf reads the compiled binary db, not the keyfiles in viper.d, so the keyfiles have
# no effect until this runs.
- name: compile the dconf database
  command: dconf update

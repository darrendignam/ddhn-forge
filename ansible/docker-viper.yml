- name: Run ViPER Ansible job against Docker container
  hosts: localhost
  tasks:
    - name: Create a Docker container
      community.docker.docker_container:
        name: docker-viper
        # Pinned by digest, not tag, so a rebuild of this branch installs the same
        # base it was tested against. Re-resolve deliberately when bumping.
        #
        # baseimage-selkies, not webtop. LinuxServer retired the KasmVNC line: the
        # webtop ubuntu-xfce-kasm branch was marked "Disabling future builds" on
        # 2026-07-04 and baseimage-kasmvnc has had no commit since 2025-07-12. There is
        # no Noble landing spot either, since baseimage-selkies:ubuntunoble was disabled
        # on 2026-06-21 and the Debian branches were deleted; ubunturesolute is the only
        # live Debian-family flavour.
        #
        # The bare base rather than webtop:ubuntu-mate: webtop would install MATE, which
        # viper.setup then installs again, plus chromium and a PPA this build strips. The
        # base is 653 packages with no desktop, so viper.setup stays the single
        # definition of the desktop for both the VM and this container.
        #
        # Ubuntu 26.04 drops libqt5webkit5 and MediaArea ship no MediaConch for it, so
        # mediaconch and mediaconch-gui come from packaging/ instead. See
        # viper.tools.viper_built.
        image: ghcr.io/linuxserver/baseimage-selkies@sha256:2b3da429ebb59b491def140acdb52a21af7cb9f7d000bd27c58fc3ef63a762fc
        state: started
        command: sleep infinity
        published_ports:
          - "3100:3000"
          - "3101:3001"
        volumes:
          # - "../volumes/data-xfce:/config"  # Mount host directory to container directory
          # - "../ansible:/ansible"  # Mount the ansible dir
        env:
          PUID: "1000"  # Set PUID environment variable
          PGID: "1000"  # Set PGID environment variable
          TZ: "Europe/London"  # Set timezone environment variable
          # Browser tab title and the name shown in the KasmVNC client. The base image
          # sets this to "Ubuntu XFCE", which is both wrong and confusing once the
          # desktop is MATE. docker commit carries container env into the published
          # image config, so setting it here is enough; it does not need a --change.
          TITLE: "ViPER"

    - name: Add container to inventory
      add_host:
        name: docker-viper
        ansible_connection: docker
        ansible_user: root

- hosts: docker-viper
  become: true
  roles:
    - { role: viper.setup }
    - { role: viper.tools }

name: Build and Push ViPER Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: opf-cloud-viper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_DOCKERHUB }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            # major and minor aliases only move for a final release, never an rc
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install ansible docker requests

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.docker

      - name: Build Docker image with Ansible provisioning
        run: |
          cd ansible
          ansible-playbook docker-viper.yml -i inventory.docker.yml

      - name: Get container ID
        id: container
        run: |
          CONTAINER_ID=$(docker ps -aqf "name=docker-viper")
          echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT

      - name: Commit container to image
        run: |
          docker commit ${{ steps.container.outputs.container_id }} viper-build:latest

      - name: Tag and push to Docker Hub and GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # Tags come from docker/metadata-action rather than being hand-rolled here.
          # The previous version pushed :latest unconditionally, so tagging a release
          # candidate made an RC the default pull for everyone. metadata-action knows
          # not to move :latest for a prerelease.
          echo "${TAGS}" | while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "Pushing ${tag}"
            docker tag viper-build:latest "${tag}"
            docker push "${tag}"
          done

      - name: Clean up
        if: always()
        run: |
          docker rm -f docker-viper || true
          docker rmi viper-build:latest || true
